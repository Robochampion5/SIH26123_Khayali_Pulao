[package]
name = "amr_coordination"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
parking_lot = "0.12"
crossbeam = "0.8"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
nalgebra = "0.32"
fixed = "1.25"
rand = "0.8"
socket2 = "0.5"
reed-solomon-erasure = "6.0.0"
bitvec = "1.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22.1"
io-uring = "0.7.15"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
